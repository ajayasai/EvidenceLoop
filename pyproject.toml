[project]
name = "evidenceloop"
version = "0.1.0"
description = "A bounded claim-to-evidence-to-action workflow"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic>=2.9", "psycopg[binary]", "httpx", "jsonschema", "python-dotenv"]

[tool.pytest.ini_options]
pythonpath = [".", "services/api"]
testpaths = ["tests"]
addopts = "-q"
